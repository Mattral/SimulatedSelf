name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: install · lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34
      - name: Cache Bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx tsc --noEmit
      - name: Verify face-api model assets
        run: |
          set -e
          for f in tiny_face_detector_model-weights_manifest.json \
                   tiny_face_detector_model.bin \
                   face_expression_model-weights_manifest.json \
                   face_expression_model.bin; do
            test -s "public/models/$f" || { echo "::error::missing public/models/$f"; exit 1; }
          done
      - run: bun run smoke:vision-worker
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, api, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34

      - name: Cache Bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # --- Frontend unit (Vitest) -----------------------------------
      - if: matrix.suite == 'unit'
        run: bunx vitest run --reporter=default

      # --- Backend API (bun test) -----------------------------------
      - if: matrix.suite == 'api'
        working-directory: apps/api
        run: |
          bun install
          bun test

      # --- Playwright E2E -------------------------------------------
      - if: matrix.suite == 'e2e'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-pw-
      - if: matrix.suite == 'e2e'
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test -c playwright.config.ts

  visual-regression:
    name: first-load visual regression (supabaseUrl guard)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.34
      - name: Cache Bun deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-pw-
      - run: bunx playwright install --with-deps chromium
      # Build + serve the production bundle so the assertion reflects
      # what users see on Vercel (missing VITE_SUPABASE_* will surface).
      - name: Build production bundle
        run: bun run build
      - name: Run first-load visual regression
        env:
          E2E_BASE_URL: http://localhost:4173
        run: |
          bunx vite preview --port 4173 --strictPort &
          PREVIEW_PID=$!
          # Wait until the preview server is reachable (max ~30s).
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4173 >/dev/null && break
            sleep 1
          done
          set +e
          bunx playwright test -c playwright.config.ts tests/e2e/first-load.visual.spec.ts
          status=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $status
      - name: Upload visual-regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-load-visual-regression
          path: |
            tests/e2e/__screenshots__/first-load
            playwright-report
          retention-days: 14

  docker:
    name: docker build (smoke)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: simulated-self-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: simulated-self-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
